[package]
name = "wooting-macro-backend"
version = "1.1.3"
edition = "2021"
description = "Macro software backend made by Wooting."
authors = ["Jeroen N", "Erik S", "Simon W", "David M", "Khang N"]
license = "GPL-3.0-only"
publish = false
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
tauri = { version = "1.5", features = ["api-all", "icon-png", "system-tray"] }
rdev = { git = "https://github.com/Narsil/rdev", rev = "b7e201bf80be7b9632207366f277d29fe732b9c1", features = ["serialize", "unstable_grab", "x11"] }
halfbrown = { version = "0.2", features = ["serde"] }
lazy_static = "1.4"
tokio = { version = "1.36", features = ["full"] }
tokio-serde = { version = "0.9", features = ["json"] }
opener = "0.6"
obws = { version = "0.11" }
rodio = "0.17"
copypasta = { version = "0.10", features = ["smithay-clipboard"] }

serde_repr = "0.1"
fastrand = "2.0"
dirs = "5.0"
itertools = "0.12"
anyhow = "1.0"
log = "0.4"
env_logger = "0.11"
rayon = "1.8"
url = "2.5"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.48.0", features = [
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
