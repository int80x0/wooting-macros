name: Publish Wootomation Active

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-tauri:
    name: ${{ matrix.name }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            rust-target: x86_64-unknown-linux-gnu
          - name: Windows
            os: windows-latest
            rust-target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
      TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable the repository Yarn version
        run: corepack enable

      - name: Install frontend dependencies
        run: yarn install --immutable

      # rdev uses the Rust 2024 edition, which requires Rust 1.85 or newer.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.85.0
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf libasound2-dev

      - name: Import Windows signing certificate
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password

      - name: Configure unsigned Windows bundle
        id: unsigned-windows-config
        if: runner.os == 'Windows' && env.WINDOWS_CERTIFICATE == ''
        shell: pwsh
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri.unsigned.conf.json'
          '{"tauri":{"bundle":{"windows":{"certificateThumbprint":null,"timestampUrl":null}}}}' | Set-Content -LiteralPath $configPath -NoNewline
          "args=--config $configPath" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Publish Tauri release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: Wootomation Active v__VERSION__
          releaseBody: |
            ## 1.1.6 Release

            - [Added] Mouse wheel actions for scrolling up and down in macro sequences.
            - [Added] Mouse wheel triggers for starting macros.
            - [Added] Mouse wheel recording with preserved action timing.
            - [Fixed] Mouse wheel triggers on Windows.
            - [Fixed] Linux release builds use a pinned, self-contained Tauri v1 logging plugin.
            - [Changed] Wootomation Active now publishes Windows and Linux release artifacts.

            ## More detailed changelog

            - Scroll actions can be added from the mouse action panel and their step count can be edited.
            - Scroll up and scroll down can be recorded as macro triggers.
            - Sequence recording captures mouse wheel input alongside keyboard and mouse button actions.
            - Windows builds work without an Authenticode certificate and retain Tauri updater signatures.
            - Linux releases include AppImage and Debian packages.
            - The logging dependency no longer relies on mutable or incomplete upstream Git workspace metadata.
          releaseDraft: true
          prerelease: false
          args: ${{ steps.unsigned-windows-config.outputs.args }}

  publish-release:
    name: Publish release
    needs: publish-tauri
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish completed draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          gh release edit "v${version}" --draft=false
