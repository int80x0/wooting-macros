name: Build Windows MSI

on:
  push:
    branches:
      - main
      - release
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-msi-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-msi:
    name: Windows MSI
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
      WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable the repository Yarn version
        run: corepack enable

      - name: Install frontend dependencies
        run: yarn install --immutable

      # Rust 1.80 and newer cannot compile the time 0.3.34 version in the
      # repository lockfile. Keep CI reproducible until that dependency is updated.
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.79.0
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Import Windows signing certificate
        if: env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $certificatePath = Join-Path $env:RUNNER_TEMP 'certificate.pfx'
          $certificateBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          [IO.File]::WriteAllBytes($certificatePath, $certificateBytes)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password

      - name: Build signed MSI
        if: env.WINDOWS_CERTIFICATE != ''
        run: yarn tauri build --bundles msi --ci

      - name: Build unsigned MSI
        if: env.WINDOWS_CERTIFICATE == ''
        shell: pwsh
        run: |
          $configPath = Join-Path $env:RUNNER_TEMP 'tauri.unsigned.conf.json'
          '{"tauri":{"bundle":{"windows":{"certificateThumbprint":null,"timestampUrl":null}}}}' | Set-Content $configPath
          yarn tauri build --bundles msi --config $configPath --ci

      - name: Upload MSI
        uses: actions/upload-artifact@v4
        with:
          name: Wootomation-Windows-MSI
          path: src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
